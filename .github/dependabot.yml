# Keeps the Dockerfile's base images patched: when a pinned tag gets a new
# digest, Dependabot opens one pull request that updates them all, and CI
# builds and tests the image before anyone merges it. Version changes (a new
# .NET or Node major or minor) stay manual, as they need code changes too.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Keeps the workflows' actions current. They're pinned by commit SHA, so a
  # moved tag can't change what runs; Dependabot updates the SHA and its
  # version comment together, in one pull request that CI runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
