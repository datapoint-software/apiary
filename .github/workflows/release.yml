name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: checks
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'push' && 'docker-hub' || '' }}
    env:
      IMAGE: docker.io/datapointsoftware/apiary
      PUBLISH: ${{ github.event_name == 'push' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        id: version
        run: |
          props=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          web=$(sed -n "s/^export const version = '\(.*\)';/\1/p" src/web/projects/apiary/src/app/version.ts)
          if [ "$props" != "$web" ]; then
            echo "::error::Directory.Build.props ($props) and version.ts ($web) differ."
            exit 1
          fi
          if [ "$PUBLISH" = true ] && [ "$TAG" != "$props" ]; then
            echo "::error::Tag $TAG doesn't match the version in the code ($props)."
            exit 1
          fi
          echo "version=$props" >> "$GITHUB_OUTPUT"
      - name: Choose the image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tags="$IMAGE:$VERSION"
          case "$VERSION" in
            *-*) ;;
            *) tags="$tags,$IMAGE:latest" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/datapoint-software/apiary
          provenance: mode=max
          sbom: true
          cache-from: type=gha
