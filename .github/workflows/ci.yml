name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    name: Server
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore Datapoint.Apiary.slnx --locked-mode
      - run: dotnet build Datapoint.Apiary.slnx -c Release --no-restore
      - run: dotnet format Datapoint.Apiary.slnx --verify-no-changes --no-restore
      - run: python3 tools/third-party-notices.py --check
      - run: dotnet test --solution Datapoint.Apiary.slnx -c Release --no-build --max-parallel-test-modules 2 --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.config
      - run: python3 tools/coverage.py --check --files
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: server-coverage
          path: TestResults/*.cobertura.xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          files: TestResults/*.cobertura.xml
          disable_search: true
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check:translations
      - run: npm run lint
      - run: npx ng test apiary-ui --watch=false --coverage
      - run: npx ng test apiary --watch=false --coverage
      - run: npm run build
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          files: src/web/coverage/apiary-ui/clover.xml,src/web/coverage/apiary/clover.xml
          disable_search: true
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: dotnet build src/Datapoint.Apiary/Datapoint.Apiary.csproj -p:RestoreLockedMode=true
      - run: npm ci --no-audit --no-fund
        working-directory: src/web
      - run: npx playwright install --with-deps chromium
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
      - run: npm run e2e
        working-directory: src/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: src/web/playwright-report

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
