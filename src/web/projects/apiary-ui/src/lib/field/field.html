<label class="ap-label" [for]="id">
  {{ label() }}
  @if (optional()) {
    <span class="ap-optional">{{ '(optional)' | t }}</span>
  }
</label>
<ng-content />
<span class="ap-help" [id]="id + '-help'" [hidden]="!hasHelp()">{{ help() }}{{ helpSeparator() }}<ng-content select="[apFieldHelp]" /></span>
<span class="ap-help" aria-live="polite">{{ checking() ? ('Checking…' | t) : '' }}</span>
<span class="ap-error" [id]="id + '-error'" [hidden]="!error()">
  <ap-icon [icon]="alertIcon" />{{ error() }}
</span>
