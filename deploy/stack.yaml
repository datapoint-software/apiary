services:
  apiary:
    image: datapointsoftware/apiary:${APIARY_VERSION:?Set APIARY_VERSION to the version to deploy}
    environment:
      Apiary__Mode: Swarm
      Apiary__ServiceName: "{{.Service.Name}}"
      Apiary__Slot: "{{.Task.Slot}}"
      Apiary__NodeName: "{{.Node.Hostname}}"
    secrets:
      - source: apiary_root_key_1
        target: apiary_root_key
        uid: "1654"
        gid: "1654"
        mode: 0400
    read_only: true
    cap_drop: [ALL]
    ports:
      - { target: 8080, published: 80, protocol: tcp, mode: host }
      - { target: 8443, published: 443, protocol: tcp, mode: host }
      - { target: 8443, published: 443, protocol: udp, mode: host }
      - { target: 9443, published: 9443, protocol: tcp, mode: host }
    volumes:
      - data:/data
      - { type: tmpfs, target: /tmp }
    networks:
      - apiary
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 3
      placement:
        max_replicas_per_node: 1
        constraints: [node.labels.apiary.edge == true]
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

secrets:
  apiary_root_key_1:
    external: true

volumes:
  data:

networks:
  apiary:
    name: apiary
    driver: overlay
    attachable: true
