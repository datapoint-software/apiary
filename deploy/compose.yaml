name: apiary

services:
  apiary:
    image: apiary:dev
    build:
      context: ..
    ports:
      - "80:8080"
      - "443:8443/tcp"
      - "443:8443/udp"
      - "127.0.0.1:9443:9443"
    volumes:
      - data:/data
      - keys:/keys
    networks:
      - apiary
    restart: unless-stopped

  whoami:
    image: traefik/whoami:v1.11
    networks:
      - apiary

volumes:
  data:
  keys:

networks:
  apiary:
    name: apiary
